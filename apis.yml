name: Spring Batch 5.1
description: >-
  Spring Batch 5.1 is the latest enterprise batch processing framework release for the Spring ecosystem. Designed to
  enable development of robust batch applications vital for daily operations of enterprise systems. Version 5.1 delivers
  Micrometer metrics, virtual thread support (Java 21), and enhanced chunk-oriented processing with retry, skip, and
  restart capabilities.
